[package]
name = "snag"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
axum = "0.8"
serde_json = "1"
open = "5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

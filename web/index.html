<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>snag</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #1a1a1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #fff;
    }
    h1 span { color: #888; font-weight: 400; font-size: 14px; margin-left: 8px; }

    /* URL input */
    .url-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
    }
    .url-bar input {
      flex: 1;
      padding: 10px 14px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .url-bar input:focus { border-color: #666; }
    .url-bar input::placeholder { color: #666; }
    .url-bar button, .btn {
      padding: 10px 20px;
      background: #3a3a3a;
      border: 1px solid #555;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .url-bar button:hover, .btn:hover { background: #4a4a4a; }
    .url-bar button:disabled, .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Player section */
    .player-section {
      width: 100%;
      max-width: 800px;
      display: none;
    }
    .player-section.visible { display: block; }

    video-player {
      display: block;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    /* Range selector */
    .range-section {
      margin-top: 16px;
      padding: 16px;
      background: #222;
      border-radius: 8px;
      border: 1px solid #333;
    }

    /* Timeline */
    .timeline {
      position: relative;
      height: 32px;
      background: #333;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }
    .timeline-fill {
      position: absolute;
      top: 0;
      height: 100%;
      background: rgba(100, 200, 100, 0.2);
      border-radius: 4px;
    }
    .timeline-playhead {
      position: absolute;
      top: 0;
      width: 2px;
      height: 100%;
      background: #fff;
      pointer-events: none;
      z-index: 3;
    }
    .timeline-handle {
      position: absolute;
      top: -4px;
      width: 14px;
      height: 40px;
      border-radius: 3px;
      cursor: ew-resize;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .timeline-handle.in-handle {
      background: #4a9; border: 2px solid #5cb;
    }
    .timeline-handle.out-handle {
      background: #c55; border: 2px solid #e77;
    }

    /* Controls */
    .range-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .marker-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .marker-group label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .marker-group .in-label { color: #5cb; }
    .marker-group .out-label { color: #e77; }
    .time-input {
      width: 85px;
      padding: 4px 8px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 4px;
      color: #fff;
      font-family: monospace;
      font-size: 13px;
      text-align: center;
    }
    .time-input:focus { border-color: #666; outline: none; }
    .step-btn {
      padding: 4px 8px;
      background: #333;
      border: 1px solid #444;
      border-radius: 4px;
      color: #ccc;
      font-size: 14px;
      cursor: pointer;
      line-height: 1;
    }
    .step-btn:hover { background: #444; }
    .mark-btn {
      padding: 6px 14px;
      border-radius: 4px;
      border: 1px solid;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
    }
    .mark-btn.mark-in {
      background: rgba(74, 153, 153, 0.2);
      border-color: #4a9;
      color: #5cb;
    }
    .mark-btn.mark-out {
      background: rgba(204, 85, 85, 0.2);
      border-color: #c55;
      color: #e77;
    }
    .mark-btn:hover { filter: brightness(1.2); }

    .encode-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }
    .encode-btn {
      padding: 10px 28px;
      background: #2d6a4f;
      border: 1px solid #40916c;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .encode-btn:hover { background: #40916c; }
    .encode-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .status {
      font-size: 13px;
      color: #888;
    }
    .duration-display {
      font-size: 13px;
      color: #aaa;
      margin-left: auto;
    }

    /* GIF preview */
    .gif-section {
      width: 100%;
      max-width: 800px;
      margin-top: 20px;
      display: none;
    }
    .gif-section.visible { display: block; }
    .gif-section h2 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #fff;
    }
    .gif-preview {
      background: #222;
      border-radius: 8px;
      border: 1px solid #333;
      padding: 16px;
      text-align: center;
    }
    .gif-preview img {
      max-width: 100%;
      border-radius: 4px;
    }
    .gif-info {
      margin-top: 12px;
      font-size: 13px;
      color: #888;
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    .gif-info a {
      color: #5cb;
      text-decoration: none;
    }
    .gif-info a:hover { text-decoration: underline; }

    /* Loading overlay */
    .loading {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #aaa;
    }
    .loading.visible { display: flex; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #444;
      border-top-color: #aaa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .keyboard-hints {
      margin-top: 20px;
      font-size: 11px;
      color: #555;
      text-align: center;
    }
    kbd {
      padding: 1px 5px;
      background: #333;
      border: 1px solid #444;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>snag <span>youtube to gif</span></h1>

  <div class="url-bar">
    <input type="text" id="url-input" placeholder="Paste YouTube URL..." autofocus>
    <button id="load-btn" onclick="loadVideo()">Load</button>
    <div class="loading" id="load-spinner">
      <div class="spinner"></div>
      <span>Downloading...</span>
    </div>
  </div>

  <div class="player-section" id="player-section">
    <video-player>
      <video-skin>
        <video id="source-video" playsinline></video>
      </video-skin>
    </video-player>

    <div class="range-section">
      <div class="timeline" id="timeline">
        <div class="timeline-fill" id="timeline-fill"></div>
        <div class="timeline-playhead" id="playhead"></div>
        <div class="timeline-handle in-handle" id="handle-in">I</div>
        <div class="timeline-handle out-handle" id="handle-out">O</div>
      </div>

      <div class="range-controls">
        <div class="marker-group">
          <label class="in-label">In</label>
          <button class="step-btn" onclick="stepTime('in', -1)">&lt;</button>
          <input type="text" class="time-input" id="in-time" placeholder="--:--.--" onchange="onTimeInput('in')">
          <button class="step-btn" onclick="stepTime('in', 1)">&gt;</button>
          <button class="mark-btn mark-in" onclick="markIn()">Mark In</button>
        </div>
        <div class="marker-group">
          <label class="out-label">Out</label>
          <button class="step-btn" onclick="stepTime('out', -1)">&lt;</button>
          <input type="text" class="time-input" id="out-time" placeholder="--:--.--" onchange="onTimeInput('out')">
          <button class="step-btn" onclick="stepTime('out', 1)">&gt;</button>
          <button class="mark-btn mark-out" onclick="markOut()">Mark Out</button>
        </div>
      </div>

      <div class="encode-row">
        <button class="encode-btn" id="encode-btn" onclick="encodeGif()" disabled>Encode GIF</button>
        <div class="loading" id="encode-spinner">
          <div class="spinner"></div>
          <span>Encoding...</span>
        </div>
        <span class="status" id="status"></span>
        <span class="duration-display" id="clip-duration"></span>
      </div>
    </div>
  </div>

  <div class="gif-section" id="gif-section">
    <h2>Result</h2>
    <div class="gif-preview">
      <img id="gif-img" src="">
      <div class="gif-info">
        <span id="gif-size"></span>
        <a id="gif-download" href="" download="snag.gif">Download</a>
      </div>
    </div>
  </div>

  <div class="keyboard-hints">
    <kbd>i</kbd> mark in &nbsp; <kbd>o</kbd> mark out &nbsp; <kbd>Enter</kbd> encode
  </div>

  <script>
    // State
    let duration = 0;
    let inTime = null;
    let outTime = null;
    let dragging = null; // 'in' | 'out' | null

    // Elements
    const video = document.getElementById('source-video');
    const timeline = document.getElementById('timeline');
    const fill = document.getElementById('timeline-fill');
    const playhead = document.getElementById('playhead');
    const handleIn = document.getElementById('handle-in');
    const handleOut = document.getElementById('handle-out');
    const inTimeInput = document.getElementById('in-time');
    const outTimeInput = document.getElementById('out-time');
    const encodeBtn = document.getElementById('encode-btn');
    const clipDuration = document.getElementById('clip-duration');
    const urlInput = document.getElementById('url-input');

    // Time formatting
    function formatTime(secs) {
      if (secs == null || isNaN(secs)) return '--:--.--';
      const m = Math.floor(secs / 60);
      const s = secs - m * 60;
      return `${String(m).padStart(2, '0')}:${s.toFixed(2).padStart(5, '0')}`;
    }

    function parseTime(str) {
      const match = str.match(/^(\d+):(\d+\.?\d*)$/);
      if (!match) return null;
      const m = parseInt(match[1]);
      const s = parseFloat(match[2]);
      if (isNaN(m) || isNaN(s)) return null;
      return m * 60 + s;
    }

    // Timeline position helpers
    function timeToPercent(t) {
      return duration > 0 ? (t / duration) * 100 : 0;
    }
    function percentToTime(pct) {
      return (pct / 100) * duration;
    }
    function clientXToPercent(clientX) {
      const rect = timeline.getBoundingClientRect();
      return Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
    }

    // Update display
    function updateUI() {
      // Handles
      if (inTime != null) {
        handleIn.style.left = `calc(${timeToPercent(inTime)}% - 7px)`;
        handleIn.style.display = 'flex';
        inTimeInput.value = formatTime(inTime);
      } else {
        handleIn.style.display = 'none';
        inTimeInput.value = '';
      }

      if (outTime != null) {
        handleOut.style.left = `calc(${timeToPercent(outTime)}% - 7px)`;
        handleOut.style.display = 'flex';
        outTimeInput.value = formatTime(outTime);
      } else {
        handleOut.style.display = 'none';
        outTimeInput.value = '';
      }

      // Fill
      if (inTime != null && outTime != null) {
        fill.style.left = `${timeToPercent(inTime)}%`;
        fill.style.width = `${timeToPercent(outTime) - timeToPercent(inTime)}%`;
        fill.style.display = 'block';
      } else {
        fill.style.display = 'none';
      }

      // Encode button
      const valid = inTime != null && outTime != null && inTime < outTime;
      encodeBtn.disabled = !valid;

      // Clip duration
      if (valid) {
        const d = outTime - inTime;
        clipDuration.textContent = `${d.toFixed(2)}s clip`;
      } else {
        clipDuration.textContent = '';
      }
    }

    // Playhead tracking
    function updatePlayhead() {
      if (video.duration > 0) {
        playhead.style.left = `${(video.currentTime / video.duration) * 100}%`;
      }
      requestAnimationFrame(updatePlayhead);
    }
    requestAnimationFrame(updatePlayhead);

    // Mark in/out
    function markIn() {
      inTime = video.currentTime;
      if (outTime != null && inTime >= outTime) outTime = null;
      updateUI();
    }
    function markOut() {
      outTime = video.currentTime;
      if (inTime != null && outTime <= inTime) inTime = null;
      updateUI();
    }

    // Step time
    function stepTime(which, dir) {
      const step = dir * (1 / 30); // ~1 frame at 30fps
      if (which === 'in') {
        if (inTime == null) inTime = video.currentTime;
        inTime = Math.max(0, Math.min(duration, inTime + step));
        video.currentTime = inTime;
      } else {
        if (outTime == null) outTime = video.currentTime;
        outTime = Math.max(0, Math.min(duration, outTime + step));
        video.currentTime = outTime;
      }
      updateUI();
    }

    // Time input change
    function onTimeInput(which) {
      const input = which === 'in' ? inTimeInput : outTimeInput;
      const t = parseTime(input.value);
      if (t == null || t < 0 || t > duration) return;
      if (which === 'in') {
        inTime = t;
        video.currentTime = t;
      } else {
        outTime = t;
        video.currentTime = t;
      }
      updateUI();
    }

    // Timeline click - seek
    timeline.addEventListener('mousedown', (e) => {
      // Check if clicking on a handle
      if (e.target === handleIn) {
        dragging = 'in';
        return;
      }
      if (e.target === handleOut) {
        dragging = 'out';
        return;
      }
      // Click on timeline - seek video
      const pct = clientXToPercent(e.clientX);
      video.currentTime = percentToTime(pct);
    });

    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const pct = clientXToPercent(e.clientX);
      const t = percentToTime(pct);
      if (dragging === 'in') {
        inTime = t;
        video.currentTime = t;
      } else {
        outTime = t;
        video.currentTime = t;
      }
      updateUI();
    });

    document.addEventListener('mouseup', () => {
      dragging = null;
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // Don't trigger shortcuts when typing in inputs
      if (e.target.tagName === 'INPUT') return;

      if (e.key === 'i') { markIn(); e.preventDefault(); }
      if (e.key === 'o') { markOut(); e.preventDefault(); }
      if (e.key === 'Enter') {
        if (!encodeBtn.disabled) encodeGif();
        e.preventDefault();
      }
    });

    // URL input enter key
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadVideo();
    });

    // Load video
    async function loadVideo() {
      const url = urlInput.value.trim();
      if (!url) return;

      const loadBtn = document.getElementById('load-btn');
      const spinner = document.getElementById('load-spinner');
      loadBtn.disabled = true;
      spinner.classList.add('visible');

      // Reset state
      inTime = null;
      outTime = null;
      updateUI();
      document.getElementById('gif-section').classList.remove('visible');

      try {
        const res = await fetch('/api/resolve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(text);
        }

        const data = await res.json();
        duration = data.duration;

        // Load video into player
        video.src = data.video_url;
        video.load();
        document.getElementById('player-section').classList.add('visible');
        document.getElementById('status').textContent = `${formatTime(duration)} total`;
      } catch (err) {
        alert('Failed to load video: ' + err.message);
      } finally {
        loadBtn.disabled = false;
        spinner.classList.remove('visible');
      }
    }

    // Encode GIF
    async function encodeGif() {
      if (inTime == null || outTime == null || inTime >= outTime) return;

      encodeBtn.disabled = true;
      const spinner = document.getElementById('encode-spinner');
      spinner.classList.add('visible');
      document.getElementById('status').textContent = 'Encoding...';

      try {
        const res = await fetch('/api/encode', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            start: inTime,
            end: outTime,
          }),
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(text);
        }

        const data = await res.json();

        // Show GIF
        const gifImg = document.getElementById('gif-img');
        gifImg.src = data.gif_url + '?t=' + Date.now(); // cache-bust
        document.getElementById('gif-download').href = data.gif_url;
        document.getElementById('gif-size').textContent = formatFileSize(data.file_size);
        document.getElementById('gif-section').classList.add('visible');
        document.getElementById('status').textContent = 'Done!';
      } catch (err) {
        alert('Encoding failed: ' + err.message);
        document.getElementById('status').textContent = 'Failed';
      } finally {
        encodeBtn.disabled = false;
        spinner.classList.remove('visible');
        updateUI();
      }
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }
  </script>
</body>
</html>
